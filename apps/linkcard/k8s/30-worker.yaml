# ─────────────────────────────────────────────────────────────
# worker — 큐에서 꺼내 카드를 만든다.
#
# Service 가 없다. 아무도 이 쪽으로 요청을 보내지 않기 때문이다.
# 워커는 스스로 큐에 붙어서 일을 가져간다. 이게 동기 호출과의 큰 차이다.
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkcard-worker
  namespace: linkcard
  labels: { app: linkcard-worker }
spec:
  replicas: 2            # 늘리면 처리량이 그대로 늘어난다
  selector:
    matchLabels: { app: linkcard-worker }
  template:
    metadata:
      labels: { app: linkcard-worker }
    spec:
      containers:
        - name: worker
          image: linkcard-worker:v4
          imagePullPolicy: IfNotPresent
          env:
            - { name: RABBIT_URL, value: "amqp://linkcard:linkcard-dev@rabbitmq:5672/%2F" }
            - { name: RESULT_URL, value: "http://linkcard-web:8000/internal/result" }
            - { name: FETCH_TIMEOUT, value: "8" }
            # 한 번에 하나씩만 받아 간다. 이게 없으면 워커 하나가 큐를
            # 쓸어 가서 다른 워커가 논다.
            - { name: PREFETCH, value: "1" }
            # 첫 시도 포함 최대 3번. 재시도 사이는 5초, 15초로 점점 길게.
            # 실습이라 짧게 잡았다. 실제로는 분 단위로 잡는 경우가 많다.
            - { name: MAX_ATTEMPTS, value: "3" }
            - { name: RETRY_DELAYS, value: "5,15" }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits:   { memory: 320Mi }
