# ─────────────────────────────────────────────────────────────
# slowsite — 부하 실험용 '느린 바깥 사이트' 흉내.
#
# 병목을 재 보려면 처리 시간이 일정한 작업이 필요하다. 실제 사이트는 응답 시간이
# 들쭉날쭉하고, 수십 건씩 두드리면 남에게 폐다. 그래서 클러스터 안에 하나 둔다.
#   http://slowsite:8080/?ms=2000  → 2초 뒤에 og:title 이 든 페이지를 준다.
#
# 이미지를 따로 만들지 않는다. 파이썬 표준 라이브러리만 쓰는 스크립트를 ConfigMap 으로 넣는다.
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: slowsite
  namespace: linkcard
data:
  server.py: |
    import time, urllib.parse
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            u = urllib.parse.urlparse(self.path)
            if u.path == "/healthz":
                return self._send(b"ok", "text/plain")
            ms = int(urllib.parse.parse_qs(u.query).get("ms", ["0"])[0])
            time.sleep(min(ms, 20000) / 1000)
            html = (f'<html><head><title>slow {ms}ms</title>'
                    f'<meta property="og:title" content="느린 사이트 {ms}ms">'
                    f'<meta property="og:site_name" content="slowsite"></head>'
                    f'<body>ok</body></html>')
            self._send(html.encode(), "text/html; charset=utf-8")

        def _send(self, body, ctype):
            self.send_response(200)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass   # 요청마다 찍으면 로그 수집에 소음만 늘어난다

    # 요청마다 스레드 하나. 느린 사이트 쪽이 병목이 되면 실험이 흐려진다.
    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slowsite
  namespace: linkcard
  labels: { app: slowsite }
spec:
  replicas: 1
  selector:
    matchLabels: { app: slowsite }
  template:
    metadata:
      labels: { app: slowsite }
    spec:
      containers:
        - name: slowsite
          image: python:3.12-slim
          command: ["python", "-u", "/app/server.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - { name: script, mountPath: /app }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 96Mi }
      volumes:
        - name: script
          configMap: { name: slowsite }
---
apiVersion: v1
kind: Service
metadata:
  name: slowsite
  namespace: linkcard
spec:
  selector: { app: slowsite }
  ports:
    - port: 8080
      targetPort: 8080
