# ─────────────────────────────────────────────────────────────
# Redis — 작업 결과를 함께 보는 곳.
#
# web 파드가 여럿이면 접수한 파드와 조회하는 파드가 다르다. 결과를 파드
# 메모리에 두면 "그런 작업 없습니다"(404) 가 난다. 실제로 그랬다.
#
# 파드를 여러 개 띄우려면 상태를 파드 밖에 둬야 한다. 그게 규칙이다.
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: linkcard
spec:
  clusterIP: None
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: linkcard
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
          ports: [{ containerPort: 6379 }]
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { memory: 128Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 256Mi } }
