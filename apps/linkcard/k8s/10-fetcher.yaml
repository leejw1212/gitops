# ─────────────────────────────────────────────────────────────
# fetcher — 바깥 사이트를 실제로 긁어 오는 쪽.
#
# 바깥으로 나가는 일이라 느리고, 자주 실패한다. 그래서 web 과 나눠 둔다.
# 나눠 두면 이쪽만 따로 늘리거나 줄일 수 있다.
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkcard-fetcher
  namespace: linkcard
  labels: { app: linkcard-fetcher }
spec:
  replicas: 1
  selector:
    matchLabels: { app: linkcard-fetcher }
  template:
    metadata:
      labels: { app: linkcard-fetcher }
    spec:
      containers:
        - name: fetcher
          image: linkcard-fetcher:v3
          # kind load 로 노드에 직접 넣었으니 밖에서 받아오지 않는다.
          # 레지스트리를 쓰는 환경이라면 이 줄은 빼야 한다.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: FETCH_TIMEOUT
              value: "8"
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: linkcard-fetcher
  namespace: linkcard
spec:
  selector: { app: linkcard-fetcher }
  ports:
    - port: 8000
      targetPort: 8000
