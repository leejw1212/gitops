# ─────────────────────────────────────────────────────────────
# forwarder 가 "이 로그는 어느 파드 것인가" 를 쿠버네티스 API 에 묻는다.
# 파드와 네임스페이스를 읽을 권한만 준다. 쓰기 권한은 없다.
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd-read-pods
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd-read-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentd-read-pods
subjects:
  - kind: ServiceAccount
    name: fluentd
    namespace: logging
