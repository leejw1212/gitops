# ─────────────────────────────────────────────────────────────
# forwarder — 노드마다 하나씩 떠서, 그 노드의 컨테이너 로그를 읽는다.
#
#   읽고 → 한 줄씩 쪼개고 → 어느 파드 로그인지 붙이고 → 쓸모없는 줄 버리고
#   → 집계기(aggregator) 로 넘긴다.
# ─────────────────────────────────────────────────────────────
<system>
  log_level info
</system>

# ① 읽는다.
#    컨테이너 로그는 노드의 /var/log/containers/ 에 파일로 쌓인다.
#    파일 이름이 <파드>_<네임스페이스>_<컨테이너>-<id>.log 라서
#    이름만으로 linkcard 네임스페이스 것만 고를 수 있다.
<source>
  @type tail
  @id in_tail_linkcard
  path /var/log/containers/*_linkcard_*.log
  # 어디까지 읽었는지 적어 두는 파일. 재시작해도 이어서 읽는다.
  pos_file /var/lib/fluentd/linkcard.pos
  tag kube.*
  read_from_head true
  refresh_interval 5
  # containerd 는 한 줄을 "시각 stdout F 본문" 모양으로 남긴다(CRI 형식).
  # 이미지 기본값은 json 이라 그대로 두면 한 줄도 못 읽는다.
  <parse>
    @type cri
  </parse>
</source>

# ② 어느 파드의 로그인지 붙인다.
#    파일 이름에서 파드 이름을 뽑고, 쿠버네티스 API 에 물어 라벨까지 가져온다.
<filter kube.**>
  @type kubernetes_metadata
  @id filter_kube_metadata
  skip_labels false
  skip_container_metadata true
  skip_master_url true
  skip_namespace_metadata true
</filter>

# ③ 쓸모없는 줄은 버린다.
#    kube-probe 가 파드마다 몇 초에 한 번씩 /healthz 를 두드린다.
#    web 로그의 대부분이 이 줄이라, 여기서 버리지 않으면 정작 볼 줄이 파묻힌다.
<filter kube.**>
  @type grep
  <exclude>
    key message
    pattern /"GET \/healthz /
  </exclude>
</filter>

# ④ 읽기 좋게 펼친다.
#    kubernetes 정보는 깊게 중첩돼 있어 필요한 것만 위로 꺼낸다.
<filter kube.**>
  @type record_transformer
  enable_ruby true
  <record>
    app       ${record.dig("kubernetes", "labels", "app")}
    pod       ${record.dig("kubernetes", "pod_name")}
    container ${record.dig("kubernetes", "container_name")}
    node      ${record.dig("kubernetes", "host")}
  </record>
  remove_keys kubernetes,logtag
</filter>

# ⑤ 집계기로 넘긴다.
#    넘기지 못하면 버퍼 파일에 쌓아 두었다가 다시 보낸다.
#    버퍼를 노드 디스크에 두니 forwarder 가 재시작돼도 안 사라진다.
<match kube.**>
  @type forward
  @id out_forward
  <server>
    host fluentd-aggregator.logging.svc.cluster.local
    port 24224
  </server>
  <buffer>
    @type file
    path /var/lib/fluentd/buffer
    flush_interval 2s
    retry_forever true
  </buffer>
</match>
