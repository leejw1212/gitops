# ─────────────────────────────────────────────────────────────
# forwarder — 노드마다 하나씩 떠서, 그 노드의 컨테이너 로그를 읽는다.
#
#   읽고 → 한 줄씩 쪼개고 → 어느 파드 로그인지 붙이고 → 소음 버리고
#   → JSON 이면 필드로 펼치고 → 집계기(aggregator) 로 넘긴다.
# ─────────────────────────────────────────────────────────────
<system>
  log_level info
</system>

# ① 앱 로그를 읽는다.
#    파일 이름이 <파드>_<네임스페이스>_<컨테이너>-<id>.log 라 이름으로 linkcard 만 고른다.
<source>
  @type tail
  @id in_tail_linkcard
  path /var/log/containers/*_linkcard_*.log
  # 어디까지 읽었는지 적어 두는 파일. 재시작해도 이어서 읽는다.
  pos_file /var/lib/fluentd/linkcard.pos
  tag kube.*
  read_from_head true
  refresh_interval 5
  # containerd 는 한 줄을 "시각 stdout F 본문" 모양으로 남긴다(CRI 형식).
  <parse>
    @type cri
  </parse>
</source>

# ①-b ingress-nginx 접근 로그를 읽는다.
#    요청 번호(X-Request-ID)가 처음 생기는 곳이다. 여기서부터 따라가야 한다.
#    컨트롤러는 control-plane 노드에 있어서 DaemonSet 에 toleration 을 줬다.
<source>
  @type tail
  @id in_tail_ingress
  path /var/log/containers/*_ingress-nginx_controller-*.log
  pos_file /var/lib/fluentd/ingress.pos
  tag ingress.*
  read_from_head false
  refresh_interval 5
  <parse>
    @type cri
  </parse>
</source>

# ② 어느 파드의 로그인지 붙인다.
<filter {kube,ingress}.**>
  @type kubernetes_metadata
  @id filter_kube_metadata
  skip_labels false
  skip_container_metadata true
  skip_master_url true
  skip_namespace_metadata true
</filter>

# ③ 소음을 버린다. JSON 으로 펼치기 전에 해야 한다 — 펼치고 나면 message 가 없어진다.
#    kube-probe 가 두드리는 /healthz 는 글자 로그일 때와 JSON 로그일 때 모양이 다르다.
#    둘 다 걸러야 한다. 접근 로그를 JSON 으로 바꾸면서 옛 패턴만 두면 소음이 조용히 되살아난다.
<filter kube.**>
  @type grep
  <exclude>
    key message
    pattern /"GET \/healthz |"path":"\/healthz"/
  </exclude>
</filter>

# ④ 앱이 JSON 으로 찍은 줄은 필드로 펼친다.
#    JSON 이 아닌 줄(gunicorn 기동 메시지 등)은 건드리지 않고 그대로 둔다.
<filter kube.**>
  @type parser
  key_name message
  reserve_data true
  reserve_time true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

# ⑤ ingress 접근 로그를 칸으로 쪼갠다. 맨 끝 칸이 요청 번호다.
<filter ingress.**>
  @type parser
  key_name message
  reserve_data true
  reserve_time true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type regexp
    expression /^(?<remote_addr>\S+) - (?<remote_user>\S+) \[(?<time_local>[^\]]+)\] "(?<method>\S+) (?<path>\S+) (?<protocol>[^"]+)" (?<status>\d+) (?<bytes>\d+) "(?<referer>[^"]*)" "(?<user_agent>[^"]*)" (?<request_length>\d+) (?<request_time>[\d.]+) \[(?<upstream_name>[^\]]*)\] \[(?<upstream_alt>[^\]]*)\] (?<upstream_addr>\S+) (?<upstream_length>\S+) (?<upstream_time>\S+) (?<upstream_status>\S+) (?<request_id>\S+)$/
  </parse>
</filter>

# ⑥ ingress 에서는 linkcard 로 가는 접근 로그만 남긴다.
#    쪼개지지 않은 줄(컨트롤러 자체 메시지)은 path 가 없어서 여기서 빠진다.
<filter ingress.**>
  @type grep
  <regexp>
    key path
    pattern /^\/linkcard/
  </regexp>
</filter>

<filter ingress.**>
  @type record_transformer
  <record>
    event http.ingress
  </record>
</filter>

# ⑦ 읽기 좋게 펼친다.
<filter {kube,ingress}.**>
  @type record_transformer
  enable_ruby true
  <record>
    app       ${record.dig("kubernetes", "labels", "app") || record.dig("kubernetes", "labels", "app.kubernetes.io/name")}
    pod       ${record.dig("kubernetes", "pod_name")}
    container ${record.dig("kubernetes", "container_name")}
    node      ${record.dig("kubernetes", "host")}
  </record>
  # skip_container_metadata 를 켜도 docker.container_id 는 남는다. 실제로 남아 있었다.
  remove_keys kubernetes,logtag,docker
</filter>

# ⑧ 집계기로 넘긴다.
<match {kube,ingress}.**>
  @type forward
  @id out_forward
  <server>
    host fluentd-aggregator.logging.svc.cluster.local
    port 24224
  </server>
  <buffer>
    @type file
    path /var/lib/fluentd/buffer
    flush_interval 2s
    retry_forever true
  </buffer>
</match>
