# ─────────────────────────────────────────────────────────────
# aggregator — 모든 노드의 forwarder 가 보낸 로그가 모이는 한곳.
# 지금은 표준 출력으로만 내보낸다. 뒤 편에서 OpenSearch 로 바꾼다.
# ─────────────────────────────────────────────────────────────
<system>
  log_level info
</system>

<source>
  @type forward
  @id in_forward
  bind 0.0.0.0
  port 24224
</source>

# 앱 로그(kube.*)와 ingress 로그(ingress.*)를 받는다.
# <match **> 로 두면 Fluentd 자기 내부 로그(fluent.*)까지 잡는다는 경고가 난다. 받을 태그를 적는다.
<match {kube,ingress}.**>
  @type stdout
  @id out_stdout
</match>
