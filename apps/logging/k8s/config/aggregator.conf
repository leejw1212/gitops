# ─────────────────────────────────────────────────────────────
# aggregator — 모든 노드의 forwarder 가 보낸 로그가 모이는 한곳.
#
# 지금은 표준 출력으로만 내보낸다. kubectl logs 한 번이면 모든 서비스의
# 로그를 한 줄기로 볼 수 있다. 뒤 편에서 이 출력을 OpenSearch 로 바꾼다.
# ─────────────────────────────────────────────────────────────
<system>
  log_level info
</system>

<source>
  @type forward
  @id in_forward
  bind 0.0.0.0
  port 24224
</source>

<match kube.**>
  @type stdout
  @id out_stdout
</match>
