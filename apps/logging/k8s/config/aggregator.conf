# ─────────────────────────────────────────────────────────────
# aggregator — 모든 노드의 forwarder 가 보낸 로그가 모이는 한곳.
# 모은 로그를 OpenSearch 에 넣는다. 날짜마다 인덱스 하나(linkcard-2026.09.15).
# ─────────────────────────────────────────────────────────────
<system>
  log_level info
</system>

<source>
  @type forward
  @id in_forward
  bind 0.0.0.0
  port 24224
</source>

# 앱 로그(kube.*)와 ingress 로그(ingress.*)를 받는다.
# <match **> 로 두면 Fluentd 자기 내부 로그(fluent.*)까지 잡는다는 경고가 난다. 받을 태그를 적는다.
<match {kube,ingress}.**>
  @type opensearch
  @id out_opensearch
  host opensearch.logging.svc.cluster.local
  port 9200
  scheme http

  # 날짜별 인덱스: linkcard-YYYY.MM.DD. 오래된 날은 인덱스째로 지우면 된다.
  # 각 문서에 @timestamp 가 붙는다 — 로그가 쓰인 시각이다.
  logstash_format true
  logstash_prefix linkcard

  # OpenSearch 2 부터 문서 타입(_doc 말고 다른 것)이 없다.
  suppress_type_name true
  # 문서가 거절(400)되면 이유를 로그에 남긴다. 기본은 조용히 버린다.
  log_os_400_reason true
  # 파드 IP 를 직접 찾아다니지 않고 서비스 이름으로만 붙는다.
  reload_connections false
  reconnect_on_error true
  request_timeout 15s

  # OpenSearch 가 잠깐 멈춰도 잃지 않도록 파일에 모아 두었다가 보낸다.
  <buffer>
    @type file
    path /fluentd/buffer/opensearch
    flush_interval 5s
    chunk_limit_size 8MB
    retry_forever true
    retry_max_interval 30
  </buffer>
</match>
