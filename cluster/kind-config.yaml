# ─────────────────────────────────────────────────────────────
# kind 학습용 클러스터 정의 — CNI 를 Calico 로 쓰는 구성
#
#   생성: kind create cluster --config cluster/kind-config.yaml
#   삭제: kind delete cluster --name lab
#
# 기본 CNI(kindnet) 를 끄고 만든 뒤 Calico 를 직접 설치한다.
# kind 는 CNI 를 "클러스터를 만들 때" 정하므로, 이미 돌고 있는
# 클러스터에서 갈아끼우는 것보다 다시 만드는 쪽이 깨끗하다.
# ─────────────────────────────────────────────────────────────
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab

networking:
  # 기본 CNI(kindnet) 를 설치하지 않는다.
  # 이걸 켜 두면 노드가 NotReady 로 멈춰 있는데, 정상이다.
  # CNI 가 없으면 파드 네트워크를 만들 수 없어서 kubelet 이 Ready 를 안 준다.
  disableDefaultCNI: true

  # 파드에 나눠 줄 IP 대역.
  #
  # Calico 문서는 기본값 192.168.0.0/16 을 쓰지만, 가정용 공유기가
  # 대개 192.168.0.x 를 쓴다. 이 맥의 LAN 주소도 192.168.0.x 라
  # 그대로 뒀다면 파드 IP 와 집 네트워크가 겹쳤을 것이다.
  # kind 기본값인 10.244.0.0/16 을 유지한다.
  podSubnet: "10.244.0.0/16"

nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
