# ─────────────────────────────────────────────────────────────
# ArgoCD Application — git 의 매니페스트를 클러스터에 맞춰 준다.
#
#   source      : 어느 저장소의 어느 경로를 볼지
#   destination : 어느 클러스터의 어느 네임스페이스에 넣을지
#   syncPolicy  : 자동으로 맞출지, 사람이 눌러야 할지
# ─────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stateful-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/leejw1212/gitops.git
    targetRevision: main
    path: manifests/stateful-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: stateful-demo

  syncPolicy:
    # 아직 자동 동기화는 켜지 않는다. 먼저 손으로 눌러 보고,
    # 드리프트 실습을 할 때 켠다.
    syncOptions:
      - CreateNamespace=true    # 네임스페이스가 없으면 만들어 준다
