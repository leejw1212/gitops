# ─────────────────────────────────────────────────────────────
# 로그 수집기도 ArgoCD 에 맡긴다. linkcard 와 따로 둔다.
# 앱을 지웠다 다시 깔아도 로그 수집은 계속 돌아야 하기 때문이다.
# ─────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/leejw1212/gitops.git
    targetRevision: main
    path: apps/logging/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
