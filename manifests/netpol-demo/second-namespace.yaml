# 두 번째 네임스페이스. 정책은 하나도 만들지 않는다.
# 이미 있는 GlobalNetworkPolicy 가 여기까지 적용되는지 보는 것이 목적이다.
apiVersion: v1
kind: Namespace
metadata:
  name: netpol-demo2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: netpol-demo2
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: agnhost
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          args: ["netexec", "--http-port=8080"]
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: netpol-demo2
spec:
  selector: { app: web }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: v1
kind: Pod
metadata:
  name: client-blocked
  namespace: netpol-demo2
  labels: { role: blocked }
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "36000"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client-allowed
  namespace: netpol-demo2
  labels: { role: allowed }
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "36000"]
