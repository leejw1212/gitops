# StatefulSet — 파드마다 고정된 이름과 전용 저장소를 준다.
apiVersion: v1
kind: Service
metadata:
  name: notes
  namespace: stateful-demo
spec:
  # clusterIP: None → 헤드리스 서비스.
  # 서비스가 트래픽을 나눠 주는 대신, 파드 하나하나에 DNS 이름을 달아 준다.
  clusterIP: None
  selector: { app: notes }
  ports: [{ port: 80 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notes
  namespace: stateful-demo
spec:
  serviceName: notes
  replicas: 3

  # 파드 번호 범위를 [2, 2+3) = 2,3,4 로 옮긴다.
  # 개수는 3 그대로인데 0,1 이 빠지고 3,4 가 새로 생긴다.
  ordinals:
    start: 2
  # 만든 뒤에는 못 바꾸는 필드다. ArgoCD 가 어떻게 반응하는지 본다.
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: notes }
  template:
    metadata:
      labels: { app: notes }
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 36000"]
          volumeMounts:
            - name: data
              mountPath: /data
  # ★ 핵심. 파드마다 PVC 를 하나씩 자동으로 만들어 준다.
  #   Deployment 에는 이 항목이 아예 없다.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 100Mi
