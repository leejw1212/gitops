# 비교용 — 같은 일을 Deployment 로 하면 어떻게 되는가.
# volumeClaimTemplates 가 없고, emptyDir(파드와 생사를 같이하는 임시 공간)을 쓴다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-deploy
  namespace: stateful-demo
spec:
  replicas: 3
  selector:
    matchLabels: { app: notes-deploy }
  template:
    metadata:
      labels: { app: notes-deploy }
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 36000"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
