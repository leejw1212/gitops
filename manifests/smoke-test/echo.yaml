# ─────────────────────────────────────────────────────────────
# 종단 검증용 샘플 앱
#
# 확인하려는 경로:
#   브라우저(맥) :80
#     → kind extraPortMappings (control-plane 컨테이너 :80)
#       → ingress-nginx hostPort :80
#         → Ingress 규칙 매칭
#           → Service (ClusterIP)
#             → Pod (워커 노드에 분산)
#
# agnhost 는 쿠버네티스 e2e 테스트 공식 이미지로 멀티아키(arm64) 지원.
# /hostname 으로 요청을 처리한 파드 이름을 돌려주므로
# 로드밸런싱이 실제로 도는지 눈으로 확인할 수 있다.
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  labels: { app: echo }
spec:
  replicas: 3
  selector:
    matchLabels: { app: echo }
  template:
    metadata:
      labels: { app: echo }
    spec:
      # 파드를 노드에 고르게 흩뿌린다. 워커를 2대 둔 이유를 확인하는 부분.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: echo }
      containers:
        - name: agnhost
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: echo
spec:
  selector: { app: echo }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port: { number: 80 }
